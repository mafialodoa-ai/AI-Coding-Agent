name: AI Coding Agent - Quick Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 📦 Install Dependencies
      run: |
        pip install torch transformers numpy -q
    
    - name: 🧪 Test Model
      run: python test_model.py
    
    - name: ✅ Summary
      run: |
        echo "✅ AI Coding Agent Test Complete"
        echo "Repository: mafialodoa-ai/AI-Coding-Agent"
        echo "Status: SUCCESS"
        date
